<!doctype html>
<html>
<head><meta charset="utf-8"><title>e2e</title></head>
<body>
<iframe id="app" src="/" style="width:1400px;height:900px"></iframe>
<pre id="report">running</pre>
<script>
const results = {};
const app = () => document.getElementById("app").contentDocument;
const win = () => document.getElementById("app").contentWindow;

function waitFor(fn, timeoutMs = 8000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const tick = () => {
      try {
        const v = fn();
        if (v) return resolve(v);
      } catch (e) { /* retry */ }
      if (Date.now() - start > timeoutMs) return reject(new Error("timeout"));
      setTimeout(tick, 100);
    };
    tick();
  });
}

async function run() {
  const report = [];
  const check = (name, ok, detail = "") => {
    results[name] = { ok: !!ok, detail };
    report.push(`${ok ? "PASS" : "FAIL"} ${name} ${detail}`);
  };

  try {
    // A: three-layer tree renders expanded by default
    await waitFor(() => {
      const doc = app();
      return doc.querySelectorAll("#trackList .track-list-item").length > 0;
    });
    const doc = app();
    const sources = doc.querySelectorAll(".group-header.source-item");
    const collections = doc.querySelectorAll(".group-header.collection-item");
    const items = doc.querySelectorAll("#trackList .track-list-item");
    check("tree-renders",
      sources.length === 1 && collections.length === 1 && items.length === 1,
      `sources=${sources.length} collections=${collections.length} items=${items.length}`);
    check("expanded-default",
      doc.querySelector(".group-header.source-item").classList.contains("expanded"),
      "");

    // B: clicking collection header collapses it
    collections[0].click();
    const afterCollapse = app().querySelectorAll("#trackList .track-list-item").length;
    check("collapse-hides-items", afterCollapse === 0, `items-after-collapse=${afterCollapse}`);
    app().querySelector(".group-header.collection-item").click();
    const afterExpand = app().querySelectorAll("#trackList .track-list-item").length;
    check("expand-restores-items", afterExpand === 1, `items=${afterExpand}`);

    // persistence key written
    const stored = win().localStorage.getItem("echo-collapsed-groups");
    check("collapse-persisted", stored !== null && JSON.parse(stored).length >= 0, String(stored));
    // restore default (remove any collapsed keys)
    win().localStorage.removeItem("echo-collapsed-groups");

    // C: search filters to flat list
    const search = app().querySelector("#librarySearch");
    search.value = "bbc";
    search.dispatchEvent(new (win()).Event("input", { bubbles: true }));
    const searchMiss = app().querySelectorAll("#trackList .track-list-item").length;
    check("search-no-match-hides", searchMiss === 0 && !!app().querySelector(".tree-empty"),
      `matches=${searchMiss}`);
    search.value = "dream";
    search.dispatchEvent(new (win()).Event("input", { bubbles: true }));
    const searchHit = app().querySelectorAll("#trackList .track-list-item").length;
    check("search-matches-title", searchHit === 1, `matches=${searchHit}`);
    search.value = "";
    search.dispatchEvent(new (win()).Event("input", { bubbles: true }));
    const restored = app().querySelectorAll("#trackList .track-list-item").length;
    check("search-clear-restores-tree", restored === 1, `items=${restored}`);

    // D: click item -> loads SRT, lines rendered
    app().querySelector("#trackList .track-list-item").click();
    await waitFor(() => {
      const d = app();
      return d.querySelectorAll("#transcript .line").length > 0;
    }, 10000);
    const lineCount = app().querySelectorAll("#transcript .line").length;
    check("srt-lines-render", lineCount > 0, `lines=${lineCount}`);
    const trackName = app().querySelector("#trackName").textContent;
    check("title-override", trackName === "Why do we dream?", `trackName=${trackName}`);
    const urlHasTrack = win().location.search.includes("track=dreams");
    check("url-track-param", urlHasTrack, win().location.search);

    // E: prev/next line stepping (wait for SRT timings to be applied)
    await waitFor(() => win().eval("state.timingsReady === true"), 10000);
    const firstLineId = app().querySelector("#transcript .line").id;
    win().eval("stepLine(1)");
    await new Promise((resolve) => setTimeout(resolve, 300));
    const activeAfterNext = app().querySelector("#transcript .line.active");
    check("next-line-steps", activeAfterNext && activeAfterNext.id !== firstLineId,
      `active=${activeAfterNext?.id ?? "none"}`);
    win().eval("stepLine(-1)");
    await new Promise((resolve) => setTimeout(resolve, 300));
    const activeAfterPrev = app().querySelector("#transcript .line.active");
    check("prev-line-steps-back", activeAfterPrev && activeAfterPrev.id === firstLineId,
      `active=${activeAfterPrev?.id ?? "none"}`);

    // F: A-B loop state machine
    win().eval("els.audio.currentTime = 5; setAbLoopPoint('a')");
    check("ab-a-set", win().eval("Number.isFinite(state.abLoopA) && state.abLoopB === null"), "");
    win().eval("els.audio.currentTime = 12; setAbLoopPoint('b')");
    check("ab-b-set", win().eval("hasAbLoop() && Math.abs(state.abLoopB - 12) < 0.01"),
      `a=${win().eval("state.abLoopA")} b=${win().eval("state.abLoopB")}`);
    win().eval("els.audio.currentTime = 30; enforceAbLoop()");
    const afterEnforce = win().eval("els.audio.currentTime");
    check("ab-enforce-rewinds", Math.abs(afterEnforce - win().eval("state.abLoopA")) < 0.5,
      `t=${afterEnforce}`);
    win().eval("setAbLoopPoint('a')");
    check("ab-clear", !win().eval("hasAbLoop()"), "");
    win().eval("els.audio.pause()");

    // G: speed dropdown
    const speedSel = app().querySelector("#speedSelect");
    speedSel.value = "0.75";
    speedSel.dispatchEvent(new (win()).Event("change", { bubbles: true }));
    check("speed-preset", Math.abs(win().eval("els.audio.playbackRate") - 0.75) < 1e-6,
      `rate=${win().eval("els.audio.playbackRate")}`);
    speedSel.value = "custom";
    speedSel.dispatchEvent(new (win()).Event("change", { bubbles: true }));
    const customVisible = !app().querySelector("#speedCustom").hidden;
    check("speed-custom-reveals", customVisible, "");
    const customInput = app().querySelector("#speedCustom");
    customInput.value = "1.7";
    customInput.dispatchEvent(new (win()).Event("change", { bubbles: true }));
    check("speed-custom-applies", Math.abs(win().eval("els.audio.playbackRate") - 1.7) < 1e-6,
      `rate=${win().eval("els.audio.playbackRate")}`);

    // H: dictation flow — enable, mask, submit wrong then right
    const dictSwitch = app().querySelector("#dictationActive");
    dictSwitch.checked = true;
    dictSwitch.dispatchEvent(new (win()).Event("change", { bubbles: true }));
    const maskedCount = app().querySelectorAll(".line-original.masked").length;
    check("dictation-masks-all", maskedCount === 11, `masked=${maskedCount}`);
    check("dictation-hides-original-switch",
      !app().querySelector("#transcriptVisible").checked, "");

    const firstRow = app().querySelector('#transcript .dictation-row[data-dictation="line-0"]');
    const firstInput = firstRow.querySelector(".dictation-input");
    firstInput.hidden = false;
    firstInput.value = "every night when you close your eyes your brain begins a strange journey";
    firstInput.dispatchEvent(new (win()).Event("input", { bubbles: true }));
    firstInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    await new Promise((resolve) => setTimeout(resolve, 200));
    const okFeedback = app().querySelector('.dictation-feedback[data-feedback="line-0"]');
    check("dictation-correct-accepts", okFeedback.classList.contains("ok"),
      okFeedback.textContent.trim());
    const doneRow = app().querySelector('#transcript .line[data-id="line-0"]');
    const rowRevealed = app().querySelector("#line-0 .line-original").classList.contains("dictation-done")
      || app().querySelector("#line-0").classList.contains("dictation-done");
    check("dictation-reveals-row", !!rowRevealed, "");

    const secondInput = app().querySelector('#transcript .dictation-row[data-dictation="line-1"] .dictation-input');
    check("dictation-advances-focus", secondInput && !secondInput.hidden,
      `hidden=${secondInput?.hidden}`);
    secondInput.value = "for thousands of years people beleved that dreams was messages";
    secondInput.dispatchEvent(new (win()).Event("input", { bubbles: true }));
    secondInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    await new Promise((resolve) => setTimeout(resolve, 200));
    const badFeedback = app().querySelector('.dictation-feedback[data-feedback="line-1"]');
    check("dictation-wrong-shows-diff", badFeedback.classList.contains("bad"),
      badFeedback.textContent.trim().slice(0, 60));
    const missCount = badFeedback.querySelectorAll(".diff-miss").length;
    check("dictation-diff-marks-misses", missCount >= 2, `miss=${missCount}`);

    // dictation persists across reload? (state saved to localStorage)
    const dictPersisted = win().localStorage.getItem("echo-dictation-active");
    check("dictation-persisted", dictPersisted === "true", String(dictPersisted));
    win().localStorage.removeItem("echo-dictation-active");
    win().localStorage.removeItem("echo-playback-rate");
  } catch (error) {
    check("unexpected-error", false, String(error));
  }

  document.getElementById("report").textContent =
    "E2E-RESULTS " + JSON.stringify(results) + "\n" + report.join("\n");
}
window.addEventListener("load", () => setTimeout(run, 300));
</script>
</body>
</html>
